apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ncloud-cluster-store
spec:
  # serverRole is only accepted in a ClusterSecretStore. Limit the namespaces
  # that may use the node's role.
  conditions:
    - namespaces:
        - team-a
  provider:
    ncloud:
      endpoint: https://ocapi-kr.ncloud.com/secretmanager
      auth:
        # Sign with the temporary key of the Server Role attached to the node
        # the controller runs on (the node pool's Node IAM Role on Ncloud
        # Kubernetes Service). No Kubernetes Secret is involved.
        serverRole: {}
