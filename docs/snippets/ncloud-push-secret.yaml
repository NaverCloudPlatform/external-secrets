apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-db-cred
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: SecretStore
      name: ncloud-secret-store
  selector:
    secret:
      name: db-secret              # holds username and password
  data:
    - match:
        secretKey: password        # omit to push the whole Data map as JSON
        remoteRef:
          remoteKey: app-db-cred   # Ncloud secret name, created if missing
          # property: pass         # optional: merge under one top-level key.
          #                        # Requires secretKey above.
