apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ncloud-secret-store
spec:
  provider:
    ncloud:
      endpoint: https://ocapi-kr.ncloud.com/secretmanager
      # Optional. When true, PushSecret deletion destroys the remote secret
      # immediately instead of stopping at the REVOKE (deletion requested)
      # state that Ncloud finalizes when its grace period ends.
      # forceDeleteWithoutRecovery: true
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: ncloud-credentials
            key: access-key-id
          secretKeySecretRef:
            name: ncloud-credentials
            key: secret-key
