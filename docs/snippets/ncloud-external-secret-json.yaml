apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: ncloud-secret-store
  target:
    name: db-secret
  data:
    - secretKey: username
      remoteRef:
        key: db-cred
        property: username
    - secretKey: password
      remoteRef:
        key: db-cred
        property: password
