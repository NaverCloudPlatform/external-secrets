apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ncloud-cluster-store
spec:
  # podIdentity is only accepted in a ClusterSecretStore. Limit the namespaces
  # that may use the controller's Pod Identity role.
  conditions:
    - namespaces:
        - team-a
  provider:
    ncloud:
      endpoint: https://ocapi-kr.ncloud.com/secretmanager
      auth:
        # Sign with the temporary key of the role that Ncloud Kubernetes
        # Service Pod Identity associates with the controller pod's
        # ServiceAccount. The token and the exchange endpoint come from the
        # Pod Identity add-on, which injects them into a controller pod
        # labeled nks.ncloud.com/pod-identity: "true"; no Kubernetes Secret
        # is involved.
        podIdentity: {}
