apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: all-db-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: ncloud-secret-store
  target:
    name: all-db-k8s-secrets
  dataFrom:
    - find:
        path: "db-"          # keep only secrets whose name starts with "db-"
        name:
          regexp: "prod$"    # and, among those, whose name ends with "prod"
