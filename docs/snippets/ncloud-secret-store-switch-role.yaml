apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ncloud-cluster-role-store
spec:
  conditions:
    - namespaces:
        - team-a
  provider:
    ncloud:
      endpoint: https://ocapi-kr.ncloud.com/secretmanager
      auth:
        serverRole: {}
      # Switch to this role through the Secure Token Service and sign Secret
      # Manager requests with its temporary key. The node role (or a
      # secretRef key) then only needs the switchRole permission on it.
      role: nrn:PUB:IAM::1234567890:Role/0123456789abcdef
      # The Secure Token Service the switch goes through is a controller
      # flag, --ncloud-sts-endpoint, not a store field.
