# Modified from https://github.com/external-secrets/external-secrets by NAVER Cloud Corp.

suite: test SecretStore
template: tests/crds/secretstore.yml
tests:
  - it: matches SecretStore correctly
    asserts:
      - matchSnapshot:
          path: tests/__snapshot__
          # We deliberately want to test all the included elements.
          ignoreErrors:
            - "in body should have at most 1 properties"
            # cty fills every plain string field with the literal "string", so a
            # field whose pattern excludes that word can never validate here.
            # This entry SUPPRESSES that error; it is not coverage of the
            # pattern. The pattern is covered by the ncloud module's
            # endpoint_test.go, which checks the Go marker against
            # NormalizeEndpoint and checks that the generated CRDs carry it.
            # At runtime the https:// requirement is enforced by the CRD at
            # apply time and by the provider at admission and client
            # construction.
            - "spec.provider.ncloud.endpoint in body should match"
            # Same suppression for the optional role field, whose pattern
            # requires the nrn: prefix. It is covered by the same ncloud tests
            # as endpoint.
            - "spec.provider.ncloud.role in body should match"
