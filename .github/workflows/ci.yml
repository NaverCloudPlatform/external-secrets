# CI of github.com/NaverCloudPlatform/external-secrets.
#
# It tests what the fork adds: the ncloud provider module, the API types and
# CRDs generated from them, and the chart. It also builds what the image
# ships, which is every provider, and scans that build for advisories.
# The tests of everything else are upstream's CI's: that code is upstream's at
# the tag the fork is based on, and running the whole upstream suite (63
# modules) here would spend the public runner on code this repository does
# not change.
# Images are not published from here; the maintainers build each release and
# attach its chart to the GitHub release.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # govulncheck is why this also runs on a schedule: an advisory lands on code
  # that has not changed, and an untouched tree is exactly what it must see.
  # GitHub turns a schedule off after 60 days without repository activity;
  # re-enable the workflow on the Actions tab when that happens.
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

# A new push supersedes a pull request's run; a push to main or the weekly
# scan is never cancelled by another run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOVULNCHECK_VERSION: "1.6.0"

jobs:
  ncloud:
    name: ncloud provider
    runs-on: ubuntu-latest
    # A hung step would otherwise hold a runner for the six-hour default.
    timeout-minutes: 40
    steps:
      # Pinned by commit, as in the other NAVER Cloud Kubernetes repositories:
      # a tag is mutable, and an action runs with the checkout in reach.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # A change to the ncloud types that forgot `make generate` ships CRDs
      # that do not match the code; the apiserver then prunes the new field.
      - name: Generated code and CRDs are up to date
        run: |
          make generate
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            exit 1
          fi

      # The provider and the API types it extends.
      - name: Unit tests (ncloud provider and API types)
        run: make test TEST_PKGS="./providers/v1/ncloud/... ./apis/..."

      - name: Lint (ncloud provider)
        run: make lint LINT_TARGET=providers/v1/ncloud

      - name: Build (PROVIDER=all_providers)
        run: make build PROVIDER=all_providers ARCH=amd64

      # Last, so a new advisory does not hide a test failure.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v${GOVULNCHECK_VERSION}
      - name: govulncheck (root module, the build the image ships)
        run: "$(go env GOPATH)/bin/govulncheck -tags=all_providers ./..."
      - name: govulncheck (ncloud provider module)
        working-directory: providers/v1/ncloud
        run: "$(go env GOPATH)/bin/govulncheck ./..."

  chart:
    name: chart and CRDs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The runner image's helm is whatever Ubuntu release ubuntu-latest
      # points at (Helm 4 from Ubuntu 26.04 on), so the chart tests run on a
      # pinned release instead, verified against its published checksum and
      # put first on PATH. The version and checksum are the ones the chart
      # tests are maintained against; the checksum is from
      # https://get.helm.sh/helm-<version>-linux-amd64.tar.gz.sha256sum.
      - name: Install helm
        env:
          HELM_VERSION: v3.19.0
          HELM_SHA256: a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496
        run: |
          set -euo pipefail
          archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          workdir=$(mktemp -d)
          curl -fsSL -o "${workdir}/${archive}" "https://get.helm.sh/${archive}"
          (cd "$workdir" && echo "${HELM_SHA256}  ${archive}" | sha256sum --check --strict)
          tar -xzf "${workdir}/${archive}" -C "$workdir" linux-amd64/helm
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${workdir}/linux-amd64/helm" "${HOME}/.local/bin/helm"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          rm -rf "$workdir"
          "${HOME}/.local/bin/helm" version

      # The fork changes the chart's defaults and adds the ncloud fields to
      # the store CRDs; both have snapshot tests that a chart-only pull
      # request would otherwise never run.
      - name: Chart unit tests
        run: make helm.test

      - name: CRD compatibility
        run: make test.crds
